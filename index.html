<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/cadastro.css">
    <link rel="stylesheet" href="styles/propaganda.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="shortcut icon" href="assets/icons/nature.svg" type="image/x-icon">
    <title>Farmtech</title>
</head>
<body>

    <main>

        <section class="propaganda">
            
        </section>

        <section class="cadastro1">
            <form action="" method="post">

                <div class="caixalogin">
                    <h1>Farmtech</h1>
                    <img src="assets/icons/nature.svg" alt="Logo" class="logo">
                </div>

                <fieldset class="arealogin">

                    <div class="mensagem">
                        <h2>Venha fazer parte do nosso <span>Time.</span></h2>
                    </div>

                    <div class="container">
                        <div class="caixaemail">
                            <label>
                                <p>Email</p>
                                <input type="email" name="" id="email" autofocus placeholder="Ex: colheitatriste@Gmail...">
                            </label>
                        </div>
    
                        <div class="caixasenha">
                            <label>
                                <p>Senha</p>
                                <input type="password" name="" id="" placeholder="Digite sua senha...">
                            </label>
                        </div>
                    </div>

                    <div class="caixabotao">
                        <button class="botaologin">Login</button>
                    </div>

                    <div class="caixainfo">
                        <a href="">Esqueçeu a senha?</a>
                        <a href="">Ainda não tem cadastro?</a>
                    </div>

                </fieldset>

            </form>
        </section>

    </main>

</body>
</html>
